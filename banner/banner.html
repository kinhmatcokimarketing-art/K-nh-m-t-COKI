<!doctype html><html><head><meta charset="utf-8"><style>
:root{--b:#4c9efd;--bd:#2f7fe0;--p:#fa25b2;--ink:#17326b}
*{margin:0;padding:0;box-sizing:border-box}
body{width:960px;height:1200px;overflow:hidden;font-family:'Inter Display','Inter',sans-serif;position:relative;
background:linear-gradient(160deg,#6cb2ff 0%,#4c9efd 55%,#3b8af0 100%)}
.paper{position:absolute;left:32px;top:32px;right:32px;bottom:32px;background:#f6f9ff;border-radius:22px;overflow:hidden;box-shadow:0 14px 40px rgba(20,60,140,.35)}
.top{position:absolute;left:36px;right:36px;top:22px;display:flex;justify-content:space-between;font-weight:700;font-size:15px;letter-spacing:.14em;color:var(--bd);border-bottom:2px solid var(--b);padding-bottom:8px}
.model{position:absolute;left:455px;top:56px;width:450px;z-index:1;clip-path:inset(0 0 215px 0)}
.t1{position:absolute;left:44px;top:76px;font-weight:900;font-size:100px;line-height:.9;color:var(--ink);letter-spacing:-.02em;z-index:2}
.t2{position:absolute;left:44px;top:164px;font-weight:900;font-size:100px;line-height:1;color:var(--b);letter-spacing:-.03em;z-index:2;white-space:nowrap}
.t2 span{color:var(--p)}
.month{position:absolute;left:44px;top:290px;z-index:2;background:var(--p);color:#fff;font-weight:900;font-size:50px;padding:6px 26px;border-radius:14px;transform:rotate(-2deg);box-shadow:0 6px 0 #c2128a}
.sub{position:absolute;left:46px;top:382px;z-index:2;font-weight:800;font-size:31px;color:var(--ink);letter-spacing:.01em;line-height:1.2}
.sub small{display:block;font-size:18px;font-weight:600;color:var(--bd);margin-top:6px;letter-spacing:.02em}
.hero{position:absolute;left:0;right:0;top:488px;height:236px;background:var(--b);z-index:3;display:flex;align-items:center;padding:0 44px;color:#fff;
 clip-path:polygon(0 12%,100% 0,100% 100%,0 100%)}
.hero .l{font-weight:900;font-size:44px;line-height:1.3;letter-spacing:.01em;margin-top:30px}
.hero .big{font-weight:900;font-size:128px;line-height:.9;letter-spacing:-.04em;margin:4px 0 0;display:flex;align-items:baseline;gap:10px;white-space:nowrap}
.hero .big em{font-style:normal;font-size:62px;letter-spacing:-.01em;color:#fff}
.hero .big .amp{color:#ffe14d;font-size:70px}
.hero .s{font-weight:800;font-size:28px;line-height:1.4;margin-top:2px;letter-spacing:.04em}
.grid{position:absolute;left:36px;right:36px;top:746px;display:grid;grid-template-columns:1fr 1fr;gap:16px;z-index:3}
.card{background:#fff;border:3px solid var(--b);border-radius:20px;padding:16px 20px 14px;height:120px;display:flex;flex-direction:column;justify-content:center;box-shadow:0 6px 0 rgba(76,158,253,.35)}
.card.pink{border-color:var(--p);box-shadow:0 6px 0 rgba(250,37,178,.3)}
.card .k{font-weight:800;font-size:19px;color:var(--ink);letter-spacing:.02em;line-height:1.1}
.card .v{font-weight:900;font-size:50px;line-height:1;letter-spacing:-.02em;margin-top:4px;color:var(--b)}
.card.pink .v{color:var(--p)}
.card .v small{font-size:26px;font-weight:900;letter-spacing:0}
.wide{grid-column:1/3;height:112px;flex-direction:row;align-items:center;justify-content:space-between;gap:20px}
.wide .v{margin:0}
.cta{position:absolute;left:50%;transform:translateX(-50%);bottom:30px;z-index:4;background:linear-gradient(90deg,var(--p),#ff5fc6);color:#fff;font-weight:900;font-size:30px;letter-spacing:.03em;padding:17px 44px;border-radius:60px;box-shadow:0 8px 0 #c2128a,0 14px 24px rgba(250,37,178,.35);white-space:nowrap}
.cta i{font-style:normal;margin-right:12px}
</style></head><body>
<div class="paper">
 <div class="top"><span>THỜI BÁO COKI</span><span>SỐ ĐẶC BIỆT · THÁNG 11</span></div>
 <img class="model" src="model.png">
 <div class="t1">TIN</div>
 <div class="t2">“<span>SỐT DẺO</span>”</div>
 <div class="month">THÁNG 11</div>
 <div class="sub">ƯU ĐÃI<br>NGẬP TRÀN</div>
 <div class="hero"><div>
   <div class="l">ĐỒNG GIÁ</div>
   <div class="big">99K<span class="amp">&amp;</span>149K</div>
   <div class="s">GỌNG KÍNH</div>
 </div></div>
 <div class="grid">
  <div class="card"><div class="k">SALE OFF</div><div class="v">40%<small> GỌNG KÍNH</small></div><div class="k" style="color:var(--bd);font-size:16px;margin-top:4px">KHÔNG ĐIỀU KIỆN</div></div>
  <div class="card pink"><div class="k">GIẢM NGAY</div><div class="v">200K</div><div class="k" style="color:var(--p);font-size:16px;margin-top:4px">MỌI KHÁCH HÀNG MỚI</div></div>
  <div class="card"><div class="k">THU CŨ ĐỔI MỚI · TRỢ GIÁ</div><div class="v">650K</div></div>
  <div class="card pink"><div class="k">MUA 1 TẶNG 1</div><div class="v" style="font-size:36px;margin-top:8px">KÍNH RÂM TRENDY</div></div>
 </div>
 <div class="cta"><i>(.)</i>NHẬN NGAY ƯU ĐÃI</div>
</div>
</body></html>
